<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <link rel="stylesheet" href="css/chat.css">
</head>
<body>
<div class="chat-app">
    <header class="chat-header">
        <div class="user-info">
            <img src="img/user_icon.png" alt="User Avatar" class="avatar">
            <span id="username">Loading...</span>
        </div>
        <button class="logout-btn" onclick="onLogout()">Logout</button>
    </header>

    <div class="chat-container">
        <div class="online-users">
            <h3>Online Users</h3>
            <ul id="connectedUsers">
                <!-- Example users -->
                <li><img src="img/user_icon.png" class="user-avatar"> User 1</li>
                <li><img src="img/user_icon.png" class="user-avatar"> User 2</li>
            </ul>
        </div>

        <!-- Chat Box Section -->
        <div class="chat-box">
            <div class="chat-messages" id="chatMessages">
                <!-- Chat messages will appear here -->
            </div>
            <div class="message-input">
                <!-- Attachment Button -->
                <label for="attachmentInput" class="attachment-btn">
                    📎
                </label>
                <input type="file" id="attachmentInput" class="attachment-input" />
                <input type="text" id="messageInput" placeholder="Type your message..." />
                <button onclick="sendMessage()" class="send-btn">Send</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script src="js/chat.js"></script>
</body>
</html>
