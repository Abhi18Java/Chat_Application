<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="css/register.css">
</head>
<body>
<div class="register-container">
    <div class="register-card">
        <center>
            <img class="register-image" src="/img/register.png" width="70" alt="Register Image">
        </center>
        <h2>Sign Up</h2>
        <form id="registerForm" class="register-form">
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" placeholder="Enter Full Name" autocomplete="off" required>
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter Username" autocomplete="off" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter Password" autocomplete="off" required>
            </div>
            <button type="submit" class="register-btn">Sign Up</button>
        </form>
        <div class="register-text">
            <span>Already have an account? <a href="index.html">Login</a></span>
        </div>
    </div>
</div>
<script src="js/register.js"></script>
</body>
</html>
