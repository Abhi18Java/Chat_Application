<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <center>
            <img class="login-image" src="/img/login.png" width="70" alt="Login Image">
        </center>
        <div class="register-text">
            <span>Don't have an account? <a href="signUp.html">Sign up</a></span>
        </div>

        <!-- Manual Login Form -->
        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter Username" autocomplete="off" required>
            </div>
            <div class="form-group password-group">
                <label for="password">Password</label>
                <div class="password-wrapper" style="position: relative;">
                    <input type="password" id="password" placeholder="Enter Password" autocomplete="off" required>
                    <i class="eye" id="togglePassword" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer;">
                        <img src="img/eyebrow.png" width="20" height="20" alt="Show Password">
                    </i>
                </div>
            </div>
            <button type="submit" class="login-btn">Login</button>
        </form>

        <div class="forgot-text">
            <a href="forgotPassword.html">Forgot Password?</a>
        </div>

        <!-- OR Divider -->
        <div class="divider">
            <span>OR</span>
        </div>

        <!-- OAuth2 Login Buttons -->
        <div class="oauth-buttons">
            <a href="/oauth2/authorization/google" class="oauth-btn google-login">
                <img src="img/google-logo.png" width="20" height="20" alt="Google Logo">
                Login with Google
            </a>
        </div>
    </div>
</div>

<script src="js/login.js"></script>
</body>
</html>
