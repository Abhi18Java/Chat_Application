<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <center>
            <img class="login-image" src="/img/login.png" width="70" alt="Login Image">
        </center>
        <h2>Login</h2>
        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter Username" autocomplete="off" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter Password" autocomplete="off" required>
            </div>
            <button type="submit" class="login-btn">Login</button>
        </form>
        <div class="register-text">
            <span>Don't have an account? <a href="signUp.html">Sign up</a></span>
        </div>
    </div>
</div>
<script src="js/login.js"></script>
</body>
</html>
